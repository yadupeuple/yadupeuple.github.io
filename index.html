<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="L'affluence des fast-foods en direct, salle et Drive.">
  <meta name="theme-color" content="#0B1F3A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/fav-64.png?v=96" type="image/png" sizes="64x64">
  <link rel="icon" href="icons/fav-192.png?v=96" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png?v=96">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>
<body class="intro">
  <div id="map" aria-label="Carte des restaurants"></div>

  <!-- Barre du haut -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>Y'a du peuple&nbsp;?</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-search" aria-label="Rechercher">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="btn-filter" aria-label="Filtrer les restaurants">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span class="filter-badge" id="filter-badge" hidden></span>
      </button>
      <button class="icon-btn" id="btn-account" aria-label="Mon compte">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </button>
    </div>
  </header>
  <div class="demo-banner" id="demo-banner" hidden>Démo : données fictives</div>

  <button class="locate-btn" id="btn-locate" aria-label="Me localiser">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
  </button>

  <!-- Liste horizontale des restos proches -->
  <section class="cards" id="cards" aria-label="Restaurants proches"></section>

  <!-- Feuille du bas (fiche, signalement, compte, recherche) -->
  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheet-body"></div>
    <button type="button" class="scroll-hint up" id="hint-up" aria-label="Remonter" hidden><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
    <button type="button" class="scroll-hint down" id="hint-down" aria-label="Descendre" hidden><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  </section>

  <!-- Écran d'accueil -->
  <section class="welcome" id="welcome" hidden>
    <div class="welcome-inner">
      <div class="welcome-logo">
        <img src="icons/icon-512.png?v=96" alt="" width="110" height="110" style="border-radius:26px">
      </div>
      <h1>Y'a du peuple&nbsp;?</h1>
      <p class="slogan" id="slogan">Venu pour manger, pas pour poireauter.</p>
      <div class="welcome-actions">
        <button class="btn btn-primary" id="welcome-login">Se connecter ou créer un compte</button>
        <button class="btn btn-ghost-light" id="welcome-skip">Continuer sans compte</button>
      </div>
      <p class="welcome-note">La carte est consultable sans compte.<br>Un compte sert à signaler et à gagner des points.<br><a href="confidentialite.html" style="color:#94A3B8">Confidentialité</a> · <a href="cgu.html" style="color:#94A3B8">Conditions</a> · <a href="mentions-legales.html" style="color:#94A3B8">Mentions légales</a></p>
      <div class="welcome-form" id="welcome-form" hidden></div>
    </div>
  </section>

  <div class="zone-pick" id="zone-pick" hidden></div>
  <div class="offline" id="offline" role="alert" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js?v=96"></script>
</body>
</html>
