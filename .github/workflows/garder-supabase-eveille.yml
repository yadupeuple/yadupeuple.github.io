# Garde la base Supabase (offre gratuite) éveillée : elle est mise en pause après 7 jours sans activité.
# Une vraie requête publique (get_partners, la même que l'appli) est envoyée chaque jour, avec la clé publique uniquement.
name: Garder Supabase éveillé
on:
  schedule:
    - cron: '17 6,18 * * *'   # 2 fois par jour (UTC)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la base
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            'https://ygekcpnsjbbdgtmlxdce.supabase.co/rest/v1/rpc/get_partners' \
            -H 'apikey: sb_publishable_jreZhBNIOsn-athEC7nOvw_xMawIRSx' \
            -H 'Authorization: Bearer sb_publishable_jreZhBNIOsn-athEC7nOvw_xMawIRSx' \
            -H 'Content-Type: application/json' -d '{}')
          echo "Réponse : $code"
          test "$code" = "200"
